name: Review checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CONTENT_SOURCE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/review-audit.json || true
          node -e 'const a=require("/tmp/review-audit.json"); for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,direct:v.isDirect,fix:v.fixAvailable,via:v.via}));'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
