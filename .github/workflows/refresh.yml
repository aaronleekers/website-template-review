name: Refresh review dependencies
on:
  push:
    paths:
      - '.github/workflows/refresh.yml'
permissions:
  contents: read
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CONTENT_SOURCE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update review dependencies
        run: |
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json")); p.dependencies.react="19.3.1"; p.dependencies["react-dom"]="19.3.1"; p.overrides={"js-yaml@3":"3.15.2","smol-toml":"1.9.1"}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n"); fs.unlinkSync("package-lock.json");'
          npm install --package-lock-only --ignore-scripts
          npm ls react react-dom --package-lock-only
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Dependency audit
        run: |
          npm audit --json > /tmp/review-audit.json || true
          node -e 'const a=require("/tmp/review-audit.json"); console.log(a.metadata); for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,direct:v.isDirect,fix:v.fixAvailable,via:v.via}));'
      - run: npm audit --audit-level=high
      - name: Save verified package updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update review edition dependencies after validation"
            git push origin HEAD:main
          fi
